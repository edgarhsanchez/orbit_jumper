<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>orbit jumper</title>
  <!-- Phone-first: fill the visual viewport, no pinch zoom, no scroll
       bounce — the game owns every touch. viewport-fit=cover reaches
       under iOS notches; the canvas uses the full visual viewport. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#05070d">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #05070d;
      overflow: hidden;
      /* No selection/callout/scroll gestures anywhere near the game. */
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }
    #wrap { position: fixed; inset: 0; }
    canvas#game {
      width: 100%; height: 100%;
      display: block;
      touch-action: none;
      outline: none;
    }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #00e5ff; background: #05070d;
      font: 12px/1.6 ui-monospace, Menlo, monospace;
      letter-spacing: .18em;
      z-index: 10; transition: opacity .5s;
      /* Informational only — must never eat a click or keep the canvas
         from taking focus, even if removal ever fails. */
      pointer-events: none;
    }
    #loading .bar {
      width: 180px; height: 3px; margin-top: 14px;
      background: #10202a; overflow: hidden;
    }
    #loading .bar i {
      display: block; width: 40%; height: 100%;
      background: #00e5ff;
      animation: sweep 1.1s linear infinite;
    }
    @keyframes sweep { from { transform: translateX(-100%);} to { transform: translateX(350%);} }
    #install {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      display: none; align-items: center; gap: 10px;
      padding: 8px 14px; z-index: 20;
      color: #00e5ff; background: rgba(10, 20, 32, .92);
      border: 1px solid #134156; border-radius: 3px;
      font: 11px/1.4 ui-monospace, Menlo, monospace; letter-spacing: .14em;
      cursor: pointer;
    }
    #install b { color: #ffb454; font-weight: 600; }
    #install span.x { color: #5a6472; padding-left: 6px; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>
  <div id="loading">ORBIT_JUMPER_OS · LINKING<div class="bar"><i></i></div></div>
  <div id="install"></div>
  <script>
    // Install-to-home-screen. Android/desktop Chrome hand us a real
    // install prompt (beforeinstallprompt); iOS Safari has no API, so
    // the chip explains Share -> Add to Home Screen instead. Either
    // way it shows once per dismissal and never inside the installed
    // app itself.
    (() => {
      const chip = document.getElementById('install');
      const standalone = matchMedia('(display-mode: standalone)').matches
        || navigator.standalone === true;
      if (standalone || localStorage.getItem('oj_install_dismissed')) return;
      const dismiss = () => {
        chip.style.display = 'none';
        localStorage.setItem('oj_install_dismissed', '1');
      };
      let deferred = null;
      addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferred = e;
        chip.innerHTML = '<b>INSTALL</b> ORBIT JUMPER ON THIS DEVICE<span class="x">[×]</span>';
        chip.style.display = 'flex';
      });
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
      if (ios) {
        chip.innerHTML = 'INSTALL: TAP <b>SHARE</b> → <b>ADD TO HOME SCREEN</b><span class="x">[×]</span>';
        chip.style.display = 'flex';
        setTimeout(() => { if (chip.style.display !== 'none') chip.style.display = 'none'; }, 15000);
      }
      chip.addEventListener('click', async (e) => {
        if (e.target.classList.contains('x') || !deferred) { dismiss(); return; }
        deferred.prompt();
        const { outcome } = await deferred.userChoice;
        if (outcome === 'accepted') dismiss(); else chip.style.display = 'none';
        deferred = null;
      });
      addEventListener('appinstalled', dismiss);
    })();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
  <script>
    // Render at CSS resolution, not native DPR. Two reasons, both load-
    // bearing: the XAML UI double-applies scale factors above DPR 1
    // (every element draws ~3x and overlaps on a retina phone), and a
    // phone GPU pushing 3x3 the pixels through WebGL2 is a slideshow.
    // 1x is what makes the game playable on iOS/Android at all.
    Object.defineProperty(window, 'devicePixelRatio', { get: () => 1 });
  </script>
  <script>
    // Keyboard lifeline for Safari: unlike other browsers, Safari does
    // NOT give an element focus when you click it — so the canvas never
    // receives key events and the whole keyboard seems dead on a Mac.
    // Make the canvas focusable up front and take focus explicitly on
    // load and on every pointerdown.
    (() => {
      const game = document.getElementById('game');
      if (!game) return;
      game.setAttribute('tabindex', '0');
      const grab = () => game.focus({ preventScroll: true });
      game.addEventListener('pointerdown', grab);
      game.addEventListener('mousedown', grab);
      addEventListener('load', () => setTimeout(grab, 300));
    })();
  </script>
  <script>
    // Browsers gate WebAudio behind the first user gesture: the game's
    // AudioContext is born SUSPENDED, and the audio backend in the wasm
    // (cpal/rodio) never calls resume() itself — measured on the live
    // site: three clicks and a keypress left the context suspended and
    // the game silent forever. So the page owns the unlock: wrap the
    // AudioContext constructor to capture every instance the wasm
    // creates, and resume them on the first real gesture. Listeners
    // stay armed (capture phase, so the canvas can't swallow them)
    // until every context reports running.
    (() => {
      const ctxs = [];
      for (const name of ['AudioContext', 'webkitAudioContext']) {
        const Orig = window[name];
        if (!Orig) continue;
        const Wrapped = function (...args) {
          const ctx = new Orig(...args);
          ctxs.push(ctx);
          return ctx;
        };
        Wrapped.prototype = Orig.prototype;
        window[name] = Wrapped;
      }
      // The listeners stay armed FOREVER. Phones re-suspend the context
      // long after the first unlock — tab switch, screen lock, a call,
      // iOS's 'interrupted' state — and a disarmed unlock means "sound
      // works for a bit, then stops for the rest of the session".
      const resume = () => {
        for (const c of ctxs) {
          if (c.state !== 'running') c.resume().catch(() => {});
        }
      };
      for (const ev of ['pointerdown', 'touchend', 'mousedown', 'keydown', 'click']) {
        addEventListener(ev, resume, true);
      }
      // Coming back to the tab/app is not a gesture, but by then the
      // page has sticky activation, so resume() is allowed — take it.
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) resume();
      });
      addEventListener('focus', resume);
      addEventListener('pageshow', resume);
    })();
  </script>
  <script type="module">
    import init from './oj_game.js';
    // bevy binds to #game and tracks its size; the audio unlock above
    // handles the browser gesture gate.
    init().catch((e) => {
      // A thrown "Using exceptions for control flow" is winit's normal
      // wasm main-loop trampoline, not an error.
      if (!`${e}`.includes('control flow')) {
        document.getElementById('loading').textContent = 'FAILED TO START: ' + e;
        throw e;
      }
    }).finally(() => {
      const el = document.getElementById('loading');
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 600);
    });
  </script>
</body>
</html>
