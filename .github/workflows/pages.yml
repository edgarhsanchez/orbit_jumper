name: Refresh playable build in docs/ (GitHub Pages)

# Pages is configured as "deploy from branch: main /docs" (set in repo
# settings — the API route needs permissions the workflow token lacks).
# So publishing = committing the built bundle into docs/; GitHub's own
# pages-build-deployment picks it up. docs/ is deliberately NOT in the
# paths filter below, so the bot's own commit never retriggers this.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          targets: wasm32-unknown-unknown

      # Lesson from bevy_pf's pipeline: rust-cache's target pruning cannot
      # see a custom profile under a cross target in a renamed target dir
      # and silently drops the artifacts. Cache ~/.cargo via rust-cache,
      # target-wasm whole via actions/cache.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Cache target-wasm (whole, unpruned)
        uses: actions/cache@v4
        with:
          path: target-wasm
          key: target-wasm-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            target-wasm-${{ steps.toolchain.outputs.cachekey }}-

      - name: Install wasm-bindgen-cli (must match Cargo.lock pin)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126

      - name: Install wasm-opt (pinned binaryen — apt's is years old)
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_130/bin" >> "$GITHUB_PATH"

      - name: Build wasm bundle
        run: ./web/build-wasm.sh

      - name: Validate wasm binary (browsers must accept it)
        run: |
          node -e "const fs=require('fs'); if(!WebAssembly.validate(fs.readFileSync('web/dist/oj_game_bg.wasm'))) { console.error('INVALID wasm'); process.exit(1); } console.log('wasm valid');"

      - name: Commit refreshed bundle to docs/
        run: |
          rm -rf docs
          mkdir docs
          cp web/dist/index.html web/dist/oj_game.js web/dist/oj_game_bg.wasm docs/
          touch docs/.nojekyll
          git add docs
          if git diff --cached --quiet; then
            echo "docs/ unchanged — nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh playable build from ${GITHUB_SHA::9}"
          # Rebase in case main moved during the build; docs-only commits
          # rebase cleanly over anything.
          git pull --rebase origin main
          git push origin main
