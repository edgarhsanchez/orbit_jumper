[package]
name = "oj_game"
description = "orbit_jumper: the bevy app."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oj_orbits = { workspace = true }
oj_universe = { workspace = true }
oj_materials = { workspace = true }
oj_protocol = { workspace = true }
bevy = { workspace = true }
bevy_pf = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }

[features]
# Virtual geometry for massive object counts; desktop Vulkan/DX12/Metal
# class GPUs only, so it is opt-in and the standard path stays the default.
meshlet = ["bevy/meshlet"]
